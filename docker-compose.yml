services:

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    container_name: panel-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - apps/admin/.env.production
    networks:
      - panel-network

  cms:
    build:
      context: .
      dockerfile: docker/cms.Dockerfile
    container_name: panel-cms
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - apps/cms/.env.production
    networks:
      - panel-network

networks:
  panel-network:
    driver: bridge
